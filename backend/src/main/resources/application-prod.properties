server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# First admin
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# JWT and cookie
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:acm}
app.security.jwt.audience=${JWT_AUDIENCE:acm-web}
app.security.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.security.refresh-token-days=${REFRESH_DAYS:7}
app.security.cookie-secure=true

# Don't leak details
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=WARN