<div class="shell">
  <aside class="side">
    <a class="brand" routerLink="/">
      <span class="mark">ACM</span>
      <span><strong>Art Collection</strong><small>Manager • Archival</small></span>
    </a>

    <nav class="nav">
  <a class="link" routerLink="/" routerLinkActive="link--active"
     [routerLinkActiveOptions]="{ exact: true }">
    <app-icon name="home" /> Accueil
  </a>

  <a class="link" routerLink="/dashboard" routerLinkActive="link--active">
    <app-icon name="grid" />
    Tableau de bord
  </a>

  <a class="link" routerLink="/artistes" routerLinkActive="link--active">
    <app-icon name="user" /> Artistes
  </a>

  <a class="link" routerLink="/oeuvres" routerLinkActive="link--active">
    <app-icon name="image" /> Œuvres
  </a>

  @if (session.isAdmin()) {
    <a class="link" routerLink="/users" routerLinkActive="link--active">
      <app-icon name="users" />
      Utilisateurs
    </a>
  }
</nav>
    <div class="me">
      <span class="avatar">{{ initials() }}</span>
      <span class="who"><strong>{{ fullName() }}</strong><small>{{ roleLabel() }}</small></span>
      <button type="button" class="logout" (click)="logout()" aria-label="Se déconnecter">
        <app-icon name="logout" />
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="top">Collection Nationale <span class="muted">›</span> <span class="muted">Inventaire Général</span></header>
    <main class="content"><router-outlet /></main>
  </div>
</div>
